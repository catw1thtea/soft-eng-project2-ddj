{% extends "base.html" %}
{% block title %}Write a review{% endblock %}
{% block content %}
<h2>Write a review</h2>
<form method="post" class="form">
  <label>Film
    <select name="film_id" required>
      <option value="">Choose a film</option>
      {% for f in films %}
        <option value="{{ f._id }}" {% if f._id|string == selected %}selected{% endif %}>{{ f.title }} ({{ f.year }})</option>
      {% endfor %}
    </select>
  </label>
  {% with current = 5 %}{% include "_rating_picker.html" %}{% endwith %}
  <label>Review
    <textarea name="text" rows="5" placeholder="What did you think?" required></textarea>
  </label>
  <button type="submit">Post review</button>
</form>
{% endblock %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reel Talk{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Reel Talk</h1>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('logout') }}" class="small">Log out</a>
      {% endif %}
    </header>

    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
    {% endwith %}

    <section class="content">{% block content %}{% endblock %}</section>

    {% if current_user.is_authenticated %}
    <nav class="bottom">
      <a href="{{ url_for('feed') }}">Feed</a>
      <a href="{{ url_for('search') }}">Search</a>
      <a href="{{ url_for('write') }}" class="primary">+ Review</a>
      <a href="{{ url_for('profile') }}">Profile</a>
    </nav>
    {% endif %}
  </main>
</body>
</html>

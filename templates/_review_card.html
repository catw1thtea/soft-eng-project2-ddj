<article class="card">
  <div class="card-head">
    <a href="{{ url_for('film', film_id=r.film_id) }}" class="film-link"><strong>{{ r.film_title }}</strong></a>
    <span class="stars">{{ "★" * r.rating }}{{ "☆" * (5 - r.rating) }}</span>
  </div>
  <p>{{ r.text }}</p>
  <p class="small">
    <a href="{{ url_for('user_profile', username=r.username) }}" class="user-link">@{{ r.username }}</a>
    · {{ r.created_at.strftime("%b %d") }}{% if r.edited_at %} · edited{% endif %}
    {% if r.user_id == current_user.id %}
      · <a href="{{ url_for('edit_review', review_id=r._id) }}">Edit</a>
    {% endif %}
  </p>
</article>
